name: tooldawn-infra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "0.0.0.0:25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-tooldawn.sh:ro
    secrets:
      - postgres_admin_password
      - postgres_app_password
      - postgres_test_password
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
      - -c
      - log_statement=none
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "0.0.0.0:26379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./secrets/redis.acl:/usr/local/etc/redis/users.acl:ro
    secrets:
      - redis_password
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --user tooldawn ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  postgres_test_password:
    file: ./secrets/postgres_test_password
  redis_password:
    file: ./secrets/redis_password
